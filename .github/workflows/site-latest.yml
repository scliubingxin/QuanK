name: QuanK site · sync latest download and deploy

# 每天 UTC 01:00（北京时间 09:00）同步一次；发新版立即同步；改站点文件也会重新部署。
# 同步逻辑见 scripts/sync_latest_release.py：
#   确保最新 Release 上存在与当版 arm64 DMG 一致的 QuanK-latest.dmg（--clobber 覆盖旧的），
#   已一致则跳过，不重复搬运 280 MB。固定地址永远是
#   https://github.com/scliubingxin/QuanK/releases/latest/download/QuanK-latest.dmg
on:
  schedule:
    - cron: '0 1 * * *'
  release:
    types: [published]
  push:
    paths:
      - 'site/**'
      - 'scripts/sync_latest_release.py'
      - '.github/workflows/site-latest.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: quank-site-sync
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync QuanK-latest.dmg from the latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_latest_release.py

      - name: Commit download metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/latest.json
          if git diff --cached --quiet; then
            echo "NO_COMMIT metadata unchanged"
          else
            git commit -m "chore: sync latest download metadata [skip ci]"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
