name: QuanK · daily sync of the fixed download

# 每天 UTC 01:00（北京时间 09:00）同步一次；发新版立即同步；改同步逻辑也会跑一遍。
# 唯一职责：确保最新 Release 上存在与当版 arm64 DMG 内容一致的 QuanK-latest.dmg
# （--clobber 覆盖旧的），已一致则跳过，绝不重复搬运 280 MB。
# 固定地址永远是：
#   https://github.com/scliubingxin/QuanK/releases/latest/download/QuanK-latest.dmg
# 主页部署在 gh-pages 分支（Pages legacy 源），通过 GitHub Releases API 实时读取版本信息，
# 因此这里不需要部署站点、不需要写文件、不碰 git，也不依赖 Actions artifact 服务。
on:
  schedule:
    - cron: '0 1 * * *'
  release:
    types: [published]
  push:
    paths:
      - 'scripts/sync_latest_release.py'
      - '.github/workflows/site-latest.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quank-latest-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sync QuanK-latest.dmg from the latest Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/sync_latest_release.py
