<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>QuankSight 仪表盘</title>
<style>
:root{--blue:#0078CB;--ink:#1f2937;--muted:#6b7280;--line:#e5e7eb;--soft:#f6f8fb}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:14px/1.5 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
#app{padding:20px 24px 32px;max-width:1400px;margin:0 auto}
#status{padding:24px;color:var(--muted)}
header h1{margin:0;font-size:22px}
header p{margin:4px 0 0;color:var(--muted)}
.meta{font-size:12px;color:var(--muted);margin-top:6px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0 4px;align-items:flex-end}
.filter{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.filter select,.filter input{font:inherit;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;min-width:150px}
.filter select{max-width:260px}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;color:var(--ink)}
button:hover{border-color:var(--blue);color:var(--blue)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--soft)}
.kpi small{color:var(--muted);display:block}
.kpi b{font-size:24px;color:var(--blue);display:block;margin-top:4px;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.card.wide{grid-column:1/-1}
.card h2{font-size:15px;margin:0 0 6px}
.chart{height:320px}
.empty{color:var(--muted);padding:40px 0;text-align:center}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px}
th{background:var(--soft);position:sticky;top:0}
.tablewrap{max-height:360px;overflow:auto}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<p id="status">正在准备仪表盘…</p>
<div id="app" hidden></div>
<script src="boot.js"></script>
<script src="echarts.min.js"></script>
<script src="frame.js"></script>
</body>
</html>
