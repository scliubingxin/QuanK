<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:">
<title>QuankSight · 编辑</title>
<link rel="stylesheet" href="../workbench.css">
<link rel="stylesheet" href="office.css">
<style>
html,body{height:100%;margin:0;overflow:hidden;background:#eef1f6;font:13px -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#1f2937}
#qk-editor{height:100%;display:flex;flex-direction:column}
.qk-win-head{flex:none;display:flex;align-items:center;gap:10px;padding:9px 18px 9px 94px;min-height:52px;background:#fff;border-bottom:1px solid #e6ecf6}
.qk-win-head b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qk-win-head output{font-size:11.5px;color:#64748b;white-space:nowrap}
.qk-win-head button{border:1px solid #dde5ed;border-radius:6px;background:#fff;padding:4px 10px;font-size:12px}
.qk-win-loading{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#fff;color:#4b5563}
.qk-win-loading[hidden]{display:none}
.qk-win-loading .spin{width:34px;height:34px;border:3px solid #dbe7f3;border-top-color:#2f62f5;border-radius:50%;animation:qkspin .9s linear infinite}
.qk-win-loading b{font-size:15px;color:#1f2937}
.qk-win-loading small{color:#8a9099}
.qk-win-loading button{border:1px solid #2f62f5;border-radius:7px;background:#fff;color:#2f62f5;padding:7px 14px;font-size:12px}
.qk-win-loading button[hidden]{display:none}
.qk-win-card{position:absolute;top:56px;left:50%;transform:translateX(-50%);z-index:10;max-width:560px}
@keyframes qkspin{to{transform:rotate(360deg)}}
</style></head>
<body>
<div id="qk-editor"></div>
<div id="qk-loading" class="qk-win-loading"><div class="spin"></div><b>正在打开 QuankSight Office 编辑器</b><small>正在准备本机文档引擎，引擎就绪后即可编辑</small><button type="button" id="qk-retry" hidden>重试</button><button type="button" id="qk-legacy" hidden>用旧版编辑器打开</button></div>
<div id="qk-cards" class="qk-win-card"></div>
<script type="module" src="window.js"></script>
</body></html>
